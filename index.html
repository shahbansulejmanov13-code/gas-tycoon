<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"><title>Gas Tycoon SuperMax</title><script src="https://yandex.ru"></script><style>
body{margin:0;background:#010103;color:#fff;font-family:sans-serif;overflow:hidden;user-select:none;touch-action:none;-webkit-user-select:none;}
#gameCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
.ui{position:relative;z-index:10;pointer-events:none;padding:12px;display:flex;flex-direction:column;align-items:center;height:100vh;box-sizing:border-box;justify-content:space-between;}
.board{background:rgba(2,4,12,0.94);padding:12px 18px;border-radius:24px;border:1px solid #1e293b;backdrop-filter:blur(15px);pointer-events:auto;text-align:center;box-shadow:0 15px 50px rgba(0,0,0,0.85);width:95%;max-width:365px;box-sizing:border-box;margin-top:env(safe-area-inset-top,5px);}
.money{font-size:28px;font-weight:900;color:#fbbf24;text-shadow:0 0 12px rgba(251,191,36,0.5);letter-spacing:-0.5px;}
.btn{pointer-events:auto;width:100%;padding:12px;background:linear-gradient(135deg,var(--neon),#005577);color:#010205;border:none;border-radius:14px;font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 0 25px rgba(0,255,204,0.25);margin-top:6px;-webkit-tap-highlight-color:transparent;}
.btn:disabled{background:#0e1324;color:#334155;cursor:not-allowed;box-shadow:none;}
.shop{pointer-events:auto;background:rgba(2,4,12,0.94);padding:6px;border-radius:24px;border:1px solid #1e293b;backdrop-filter:blur(15px);display:flex;gap:6px;width:95%;max-width:365px;box-sizing:border-box;margin-bottom:env(safe-area-inset-bottom,5px);}
.item{background:#030611;border:1px solid #1e293b;padding:6px;border-radius:14px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:space-between;}
.i-name{font-size:9px;font-weight:bold;color:#4b5563;text-transform:uppercase;margin-bottom:2px;}
.i-btn{background:#2563eb;color:#fff;border:none;padding:7px 2px;border-radius:6px;font-size:9px;font-weight:bold;cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent;}
.i-btn:disabled{background:#0e1324;color:#334155;cursor:not-allowed;}
.biome-badge{font-size:10px;font-weight:bold;color:var(--neon);text-transform:uppercase;letter-spacing:2px;text-shadow:0 0 10px var(--neon);}
</style></head><body><canvas id="gameCanvas"></canvas><div class="ui">
    <div class="board">
        <div class="biome-badge" id="biome-disp">Орбита Земли 🌍</div>
        <div class="money" id="m-disp">0 руб.</div>
        <div style="font-size:16px;color:#38bdf8;font-weight:bold;margin:1px 0;" id="g-disp">В баках: 0.0 м³</div>
        <div style="font-size:9.5px;color:#4b5563;font-weight:bold;" id="rate-disp">Мировой курс: 3.50 р/м³</div>
        <div style="font-size:9px;color:#64748b;font-weight:bold;margin-top:2px;">КЛИК: +<span id="c-pow">1</span> | АВТО: +<span id="pps">0</span> м³/с</div>
        <button class="btn" id="btn-sell" disabled>💸 ХРАНИЛИЩЕ ПУСТО</button>
    </div>
    <div class="shop">
        <div class="item"><div class="i-name">🔧 Клик</div><button class="i-btn" id="b-click">15 р.</button></div>
        <div class="item"><div class="i-name">🚜 Вышка</div><button class="i-btn" id="b-auto1">100 р.</button></div>
        <div class="item"><div class="i-name">🏢 Завод</div><button class="i-btn" id="b-auto2">850 р.</button></div>
    </div>
</div>
<script {nonce}>
    let ysdkInstance = null; if (typeof YaGames!=='undefined'){YaGames.init().then(ysdk=>{ysdkInstance=ysdk;ysdk.adv.showFullscreenAdv({callbacks:{}});});}
    let money=Number(localStorage.getItem('gn_money'))||0, gas=Number(localStorage.getItem('gn_gas'))||0, clickPower=Number(localStorage.getItem('gn_clickPower'))||1, pps=Number(localStorage.getItem('gn_pps'))||0;
    let costClick=Number(localStorage.getItem('gn_cClick'))||15, costAuto1=Number(localStorage.getItem('gn_cAuto1'))||100, costAuto2=Number(localStorage.getItem('gn_cAuto2'))||850, marketPrice = 3.5;
    const mDisp=document.getElementById('m-disp'),gDisp=document.getElementById('g-disp'),cPowEl=document.getElementById('c-pow'),ppsEl=document.getElementById('pps'),btnSell=document.getElementById('btn-sell'),bClick=document.getElementById('b-click'),bAuto1=document.getElementById('b-auto1'),bAuto2=document.getElementById('b-auto2'),biomeDisp=document.getElementById('biome-disp'),rateDisp=document.getElementById('rate-disp');
    const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } window.addEventListener('resize', resize); resize();
    
    let ballRadius = 65; let targetRadius = 65; let glowTime = 0; let shake = 0; let planetFlash = 0;
    const particles = [], stars = [], texts = [], shockwaves = [];
    let earthAngle = 0; let satelliteAngle = 0; let meteor = { x: -200, y: 0, vx: 0, vy: 0, active: false };

    // Звёздная пыль с эффектом гиперпространственного Warp Speed
    for(let i=0; i<150; i++) { stars.push({ x: Math.random()*2000 - 1000, y: Math.random()*2000 - 1000, z: Math.random()*1000, size: Math.random()*1.5+0.5, alpha: Math.random() }); }

    const biomes = [
        { name: "Орбита Земли 🌍", neon: "#00ffcc", secondary: "#004433", glowColor: "rgba(0,255,204,0.4)", pColor: "#0066ff", clouds: true },
        { name: "Орбита Марса 🪐", neon: "#ff4400", secondary: "#441100", glowColor: "rgba(255,68,0,0.4)", pColor: "#ff3300", clouds: false },
        { name: "Квазар Сингулярности ✨", neon: "#bf55ec", secondary: "#3a015c", glowColor: "rgba(191,85,236,0.4)", pColor: "#9b5de5", clouds: true }
    ];
    let currentBiomeIdx = 0;

    function selectBiome() {
        if (money < 600) currentBiomeIdx = 0; else if (money < 3000) currentBiomeIdx = 1; else currentBiomeIdx = 2;
        let b = biomes[currentBiomeIdx]; document.documentElement.style.setProperty('--neon', b.neon); biomeDisp.textContent = b.name;
    }

    function spawnEffects(cX, cY) {
        let b = biomes[currentBiomeIdx]; shake = 12; planetFlash = 1.0; // Вспышка на планете
        for(let i=0; i<25; i++) {
            let angle = Math.random() * Math.PI * 2; let speed = Math.random() * 5 + 3;
            particles.push({ x: cX, y: cY, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed, size: Math.random()*3+2, alpha: 1, color: Math.random()>0.3?b.neon:'#38bdf8', orbit: Math.random() > 0.6 });
        }
        texts.push({ x: cX + (Math.random()-0.5)*20, y: cY - 25, text: `+${clickPower} м³`, alpha: 1, scale: 1.5, vy: -2, color: '#ffffff' });
        shockwaves.push({ x: cX, y: cY, r: 5, maxR: 120, alpha: 1, color: b.neon });
    }

    function drawPlanet(x, y, r) {
        earthAngle += 0.0006; satelliteAngle += 0.006; let b = biomes[currentBiomeIdx];
        
        // 🌀 КИНЕТИЧЕСКИЕ КОЛЬЦА С ВРАЩЕНИЕМ ОСКОЛКОВ
        ctx.save(); ctx.translate(x, y); ctx.rotate(-0.15); ctx.scale(2.4, 0.35);
        let ringGrad = ctx.createRadialGradient(0,0,r*0.95, 0,0,r*1.35); ringGrad.addColorStop(0,'transparent'); ringGrad.addColorStop(0.3, b.neon); ringGrad.addColorStop(0.7, b.pColor); ringGrad.addColorStop(1,'transparent');
        ctx.strokeStyle = ringGrad; ctx.lineWidth = r*0.3; ctx.beginPath(); ctx.arc(0,0,r*1.15,0,Math.PI*2); ctx.stroke();
        ctx.restore();

        // Многослойное атмосферное свечение (Bloom) + Вспышка клика
        ctx.save(); ctx.shadowBlur = 30 + planetFlash*40; ctx.shadowColor = b.pColor;
        let planetGrad = ctx.createRadialGradient(x - r/4, y - r/4, r*0.02, x, y, r);
        if(currentBiomeIdx===0){planetGrad.addColorStop(0,'#1e40af');planetGrad.addColorStop(1,'#030712');}
        else if(currentBiomeIdx===1){planetGrad.addColorStop(0,'#991b1b');planetGrad.addColorStop(1,'#180202');}
        else{planetGrad.addColorStop(0,'#581c87');planetGrad.addColorStop(1,'#0f051d');}
        ctx.fillStyle = planetGrad; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; ctx.clip();

        // Рельеф коры
        ctx.fillStyle = currentBiomeIdx===0?'#15803d':(currentBiomeIdx===1?'#854d0e':'#4c1d95');
        for (let i = -1; i < 3; i++) {
            let ox = x + (i * r * 1.5) + (earthAngle * r * 2.5) % (r * 3.5);
            ctx.beginPath(); ctx.arc(ox, y - r/6, r/2.5, 0, Math.PI*2); ctx.arc(ox + r/2, y + r/3, r/1.8, 0, Math.PI*2); ctx.fill();
        }

        // Облака
        if(b.clouds) {
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            for (let i = -1; i < 3; i++) {
                let cx = x + (i * r * 1.7) + (earthAngle * r * 4.2) % (r * 3.6);
                ctx.beginPath(); ctx.arc(cx, y - r/3, r*0.3, 0, Math.PI*2); ctx.arc(cx + r*0.2, y - r/3, r*0.25, 0, Math.PI*2); ctx.fill();
            }
        }
        
        // Светотень + Эффект вспышки клика
        let shadowGrad = ctx.createLinearGradient(x-r, y-r, x+r, y+r); shadowGrad.addColorStop(0, `rgba(255,255,255,${0.03 + planetFlash*0.25})`); shadowGrad.addColorStop(0.55,'rgba(0,0,0,0.5)'); shadowGrad.addColorStop(1,'rgba(0,0,0,0.99)');
        ctx.fillStyle = shadowGrad; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.restore();

        // Детализированный Спутник
        let satX = x + Math.cos(satelliteAngle)*(r*1.55); let satY = y + Math.sin(satelliteAngle)*(r*0.45);
        ctx.save(); ctx.fillStyle = "#cbd5e1"; ctx.beginPath(); ctx.arc(satX, satY, 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = b.neon; ctx.fillRect(satX - 11, satY - 1.5, 5, 3); ctx.fillRect(satX + 6, satY - 1.5, 5, 3); ctx.restore();
    }
    function draw() {
        let b = biomes[currentBiomeIdx]; glowTime += 0.04; planetFlash *= 0.92; // Гашение вспышки
        
        ctx.save(); if(shake > 0) { ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); shake *= 0.84; }
        ctx.fillStyle = '#010103'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 🌌 ПОТРЯСАЮЩИЙ ГИПЕРПРОСТРАНСТВЕННЫЙ ЭФФЕКТ ЗВЕЗД (3D Warp)
        let cx = canvas.width / 2; let cy = canvas.height / 2;
        for(let i=0; i<stars.length; i++) {
            let s = stars[i]; s.z -= 4; if(s.z <= 0) { s.z = 1000; s.x = Math.random()*2000 - 1000; s.y = Math.random()*2000 - 1000; }
            let k = 400 / s.z; let px = s.x * k + cx; let py = s.y * k + cy;
            if(px >= 0 && px < canvas.width && py >= 0 && py < canvas.height) {
                let size = s.size * k * 0.4; ctx.fillStyle = `rgba(255,255,255,${(1 - s.z/1000) * 0.85})`;
                ctx.fillRect(px, py, size, size);
            }
        }

        if(!meteor.active && Math.random() < 0.005) {
            meteor.x = Math.random()*canvas.width; meteor.y = -40; meteor.vx = (Math.random()-0.2)*10+5; meteor.vy = Math.random()*6+6; meteor.active = true;
        }
        if(meteor.active) {
            meteor.x += meteor.vx; meteor.y += meteor.vy;
            let mGrad = ctx.createLinearGradient(meteor.x, meteor.y, meteor.x-meteor.vx*4, meteor.y-meteor.vy*4); mGrad.addColorStop(0,'#fff'); mGrad.addColorStop(0.3, b.neon); mGrad.addColorStop(1,'transparent');
            ctx.strokeStyle = mGrad; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(meteor.x, meteor.y); ctx.lineTo(meteor.x-meteor.vx*4, meteor.y-meteor.vy*4); ctx.stroke();
            if(meteor.y > canvas.height + 40) meteor.active = false;
        }

        let planetSize = Math.min(canvas.width, canvas.height) * 0.16; drawPlanet(canvas.width * 0.5, canvas.height * 0.35, planetSize);

        // 💥 РАСШИРЯЮЩАЯСЯ УДАРНАЯ ВОЛНА (Shockwave Bloom)
        for(let i = shockwaves.length - 1; i >= 0; i--) {
            let sw = shockwaves[i]; sw.r += 6; sw.alpha -= 0.03;
            if(sw.alpha <= 0 || sw.r >= sw.maxR) { shockwaves.splice(i,1); continue; }
            ctx.save(); ctx.globalAlpha = sw.alpha; ctx.strokeStyle = sw.color; ctx.lineWidth = 4; ctx.shadowBlur = 20; ctx.shadowColor = sw.color;
            ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI*2); ctx.stroke(); ctx.restore();
        }

        // 🌀 ЧАСТИЦЫ С ФИЗИКОЙ ГРАВИТАЦИОННОГО ЗАКРУЧИВАНИЯ (Спираль)
        let coreX = canvas.width / 2; let coreY = canvas.height / 2 + 35;
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; 
            if(p.orbit) { // Закручивание в ядро
                let rad = Math.hypot(coreX - p.x, coreY - p.y);
                p.x += p.vx * 0.6 + (coreY - p.y) * 0.04; p.y += p.vy * 0.6 - (coreX - p.x) * 0.04;
            } else { p.x += p.vx; p.y += p.vy; p.vy += 0.06; }
            p.alpha -= 0.016; if(p.alpha <= 0) { particles.splice(i, 1); continue; }
            ctx.save(); ctx.globalAlpha = p.alpha; ctx.shadowBlur = 8; ctx.shadowColor = p.color; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); ctx.restore();
        }

        // Текст
        for(let i = texts.length - 1; i >= 0; i--) {
            let t = texts[i]; t.y += t.vy; t.alpha -= 0.025; t.scale *= 0.97; if(t.alpha <= 0) { texts.splice(i, 1); continue; }
            ctx.save(); ctx.globalAlpha = t.alpha; ctx.font = `900 ${Math.round(14*t.scale)}px sans-serif`; ctx.fillStyle = t.color; ctx.shadowBlur = 10; ctx.shadowColor = b.neon; ctx.fillText(t.text, t.x, t.y); ctx.restore();
        }

        // Пульсирующая газовая сфера-реактор
        ballRadius += (targetRadius - ballRadius) * 0.16;
        let pulseRadius = ballRadius + Math.sin(glowTime * 1.5) * 6;
        ctx.save(); ctx.shadowBlur = 30 + Math.sin(glowTime)*15; ctx.shadowColor = b.neon;
        let grad = ctx.createRadialGradient(coreX, coreY, 5, coreX, coreY, pulseRadius); grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.2, b.neon); grad.addColorStop(1, b.secondary);
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(coreX, coreY, ballRadius, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = 4; ctx.stroke(); ctx.restore();
        
        ctx.restore(); requestAnimationFrame(draw);
    }

    window.addEventListener('pointerdown', (e) => {
        if(e.target.tagName === 'BUTTON' || e.target.closest('.board') || e.target.closest('.shop')) return;
        let cx = canvas.width / 2; let cy = canvas.height / 2 + 35;
        if(Math.hypot(e.clientX - cx, e.clientY - cy) <= ballRadius + 25) {
            gas += clickPower; updateUI(); saveGame(); ballRadius = targetRadius * 0.72; spawnEffects(e.clientX, e.clientY);
            if(navigator.vibrate) navigator.vibrate(22);
        }
    });

    function updateUI(){
        selectBiome();
        mDisp.textContent=Math.floor(money).toLocaleString('ru-RU')+" руб."; gDisp.textContent="В баках: "+gas.toFixed(1)+" м³"; cPowEl.textContent=clickPower; ppsEl.textContent=pps;
        bClick.textContent=costClick+" р."; bAuto1.textContent=costAuto1+" р."; bAuto2.textContent=costAuto2+" р.";
        bClick.disabled=money<costClick; bAuto1.disabled=money<costAuto1; bAuto2.disabled=money<costAuto2; btnSell.disabled=gas <= 0;
        if(gas > 0) { btnSell.textContent = `💸 ПРОДАТЬ ЗА +${Math.floor(gas * marketPrice).toLocaleString('ru-RU')} РУБ.`; } else { btnSell.textContent = `💸 ХРАНИЛИЩЕ ПУСТО`; }
    }

    setInterval(() => {
        marketPrice += (Math.random() - 0.5) * 0.7; marketPrice = Math.min(9.50, Math.max(1.50, marketPrice));
        rateDisp.textContent = `Мировой курс: ${marketPrice.toFixed(2)} р/м³`; updateUI();
    }, 3000);

    btnSell.addEventListener('click',()=>{if(gas>0){money+=gas*marketPrice; gas=0; updateUI(); saveGame();}});
    bClick.addEventListener('click',()=>{if(money>=costClick){money-=costClick; clickPower+=1; costClick=Math.round(costClick*1.5); updateUI(); saveGame();}});
    bAuto1.addEventListener('click',()=>{if(money>=costAuto1){money-=costAuto1; pps+=1; costAuto1=Math.round(costAuto1*1.6); updateUI(); saveGame();}});
    bAuto2.addEventListener('click',()=>{if(money>=costAuto2){money-=costAuto2; pps+=15; costAuto2=Math.round(costAuto2*1.6); updateUI(); saveGame();}});
    function saveGame(){localStorage.setItem('gn_money',money); localStorage.setItem('gn_gas',gas); localStorage.setItem('gn_clickPower',clickPower); localStorage.setItem('gn_pps',pps); localStorage.setItem('gn_cClick',costClick); localStorage.setItem('gn_cAuto1',costAuto1); localStorage.setItem('gn_cAuto2',costAuto2);}
    setInterval(() => { if (pps > 0) { gas += pps / 10; updateUI(); } }, 100); updateUI(); draw();
</script></body></html>
