<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gas Tycoon: Ultimate Space</title><script src="https://yandex.ru"></script><style>
body{margin:0;background:#010205;color:#fff;font-family:sans-serif;overflow:hidden;user-select:none;}
#gameCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
.ui{position:relative;z-index:10;pointer-events:none;padding:15px;display:flex;flex-direction:column;align-items:center;height:100vh;box-sizing:border-box;justify-content:space-between;}
.board{background:rgba(4,7,20,0.88);padding:12px;border-radius:20px;border:1px solid #1e293b;backdrop-filter:blur(10px);pointer-events:auto;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,0.6);width:90%;max-width:380px;}
.money{font-size:26px;font-weight:900;color:#fbbf24;text-shadow:0 0 10px rgba(251,191,36,0.3);}
.btn{pointer-events:auto;width:100%;padding:12px;background:linear-gradient(135deg,var(--neon),#007799);color:#03050d;border:none;border-radius:12px;font-size:13px;font-weight:900;cursor:pointer;box-shadow:0 0 20px rgba(0,255,204,0.15);margin-top:8px;transition:transform 0.1s;}
.btn:active{transform:scale(0.98);}.btn:disabled{background:#1e293b;color:#475569;cursor:not-allowed;box-shadow:none;}
.shop{pointer-events:auto;background:rgba(4,7,20,0.88);padding:10px;border-radius:20px;border:1px solid #1e293b;display:flex;gap:6px;width:90%;max-width:380px;box-sizing:border-box;}
.item{background:#050a18;border:1px solid #1e293b;padding:6px;border-radius:12px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:space-between;}
.i-name{font-size:10px;font-weight:bold;color:#64748b;text-transform:uppercase;margin-bottom:4px;}
.i-btn{background:#2563eb;color:#fff;border:none;padding:6px;border-radius:6px;font-size:10px;font-weight:bold;cursor:pointer;width:100%;}
.i-btn:disabled{background:#1e293b;color:#475569;cursor:not-allowed;}
.biome-badge{font-size:11px;font-weight:bold;color:var(--neon);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
</style></head><body><canvas id="gameCanvas"></canvas><div class="ui">
    <div class="board">
        <div class="biome-badge" id="biome-disp">Орбита Земли 🌍</div>
        <div class="money" id="m-disp">0 руб.</div>
        <div style="font-size:15px;color:#38bdf8;font-weight:bold;margin:2px 0;" id="g-disp">В баках: 0.0 м³</div>
        <div style="font-size:10px;color:#64748b;font-weight:bold;margin-bottom:4px;">КЛИК: +<span id="c-pow">1</span> | ПАССИВ: +<span id="pps">0</span> м³/с</div>
        <button class="btn" id="btn-sell" disabled>💸 ХРАНИЛИЩЕ ПУСТО</button>
    </div>
    <div class="shop">
        <div class="item"><div class="i-name">🔧 Клик</div><button class="i-btn" id="b-click">15 р.</button></div>
        <div class="item"><div class="i-name">🚜 Вышка</div><button class="i-btn" id="b-auto1">100 р.</button></div>
        <div class="item"><div class="i-name">🏢 Завод</div><button class="i-btn" id="b-auto2">850 р.</button></div>
    </div>
</div>
<script {nonce}>
    let ysdkInstance = null; if (typeof YaGames!=='undefined'){YaGames.init().then(ysdk=>{ysdkInstance=ysdk;ysdk.adv.showFullscreenAdv({callbacks:{}});});}
    let money=Number(localStorage.getItem('gn_money'))||0, gas=Number(localStorage.getItem('gn_gas'))||0, clickPower=Number(localStorage.getItem('gn_clickPower'))||1, pps=Number(localStorage.getItem('gn_pps'))||0;
    let costClick=Number(localStorage.getItem('gn_cClick'))||15, costAuto1=Number(localStorage.getItem('gn_cAuto1'))||100, costAuto2=Number(localStorage.getItem('gn_cAuto2'))||850, marketPrice = 3.5;
    const mDisp=document.getElementById('m-disp'),gDisp=document.getElementById('g-disp'),cPowEl=document.getElementById('c-pow'),ppsEl=document.getElementById('pps'),btnSell=document.getElementById('btn-sell'),bClick=document.getElementById('b-click'),bAuto1=document.getElementById('b-auto1'),bAuto2=document.getElementById('b-auto2'),biomeDisp=document.getElementById('biome-disp');
    const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } window.addEventListener('resize', resize); resize();
    
    let ballRadius = 75; let targetRadius = 75; const particles = []; const stars = []; const texts = [];
    let earthAngle = 0; let satelliteAngle = 0;
    let meteor = { x: -200, y: 0, vx: 0, vy: 0, active: false };

    for(let i=0; i<100; i++) { stars.push({ x: Math.random()*2000, y: Math.random()*2000, size: Math.random()*1.5+0.5, alpha: Math.random() }); }

    const biomes = [
        { name: "Орбита Земли 🌍", neon: "#00ffcc", secondary: "#006655" },
        { name: "Орбита Марса 🪐", neon: "#ff5500", secondary: "#772200" },
        { name: "Глубокий космос ✨", neon: "#a855f7", secondary: "#4c1d95" }
    ];
    let currentBiomeIdx = 0;

    function selectBiome() {
        if (money < 600) currentBiomeIdx = 0; else if (money < 3000) currentBiomeIdx = 1; else currentBiomeIdx = 2;
        let b = biomes[currentBiomeIdx]; document.documentElement.style.setProperty('--neon', b.neon); biomeDisp.textContent = b.name;
    }

    function spawnParticles(cX, cY) {
        let b = biomes[currentBiomeIdx];
        for(let i=0; i<20; i++) {
            particles.push({ x: cX, y: cY, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6-2, size: Math.random()*3+2, alpha: 1, color: Math.random()>0.4?b.neon:'#38bdf8' });
        }
        texts.push({ x: cX, y: cY - 20, text: `+${clickPower} м³`, alpha: 1, vy: -2, color: b.neon });
    }

    function drawPlanet(x, y, r) {
        earthAngle += 0.001; satelliteAngle += 0.008; ctx.save();
        ctx.shadowBlur = 30; ctx.shadowColor = currentBiomeIdx === 0 ? '#0088ff' : (currentBiomeIdx === 1 ? '#ff4400' : '#8800ff');
        let planetGrad = ctx.createRadialGradient(x - r/3, y - r/3, 5, x, y, r);
        if(currentBiomeIdx === 0) { planetGrad.addColorStop(0, '#2b82c9'); planetGrad.addColorStop(1, '#051c38'); } 
        else if(currentBiomeIdx === 1) { planetGrad.addColorStop(0, '#cc4400'); planetGrad.addColorStop(1, '#330a00'); }
        else { planetGrad.addColorStop(0, '#5500aa'); planetGrad.addColorStop(1, '#110022'); }
        ctx.fillStyle = planetGrad; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0; ctx.clip();
        ctx.fillStyle = currentBiomeIdx === 0 ? '#4fa64f' : (currentBiomeIdx === 1 ? '#aa7744' : '#aa33aa');
        for (let i = -1; i < 3; i++) {
            let ox = x + (i * r * 1.5) + (earthAngle * r * 2) % (r * 3);
            ctx.beginPath(); ctx.arc(ox, y - r/4, r/3, 0, Math.PI*2); ctx.arc(ox + r/2, y + r/3, r/2, 0, Math.PI*2); ctx.arc(ox - r/3, y + r/4, r/4, 0, Math.PI*2); ctx.fill();
        }
        let shadowGrad = ctx.createLinearGradient(x - r, y - r, x + r, y + r); shadowGrad.addColorStop(0, 'rgba(255,255,255,0.1)'); shadowGrad.addColorStop(0.5, 'rgba(0,0,0,0.4)'); shadowGrad.addColorStop(1, 'rgba(0,0,0,0.95)');
        ctx.fillStyle = shadowGrad; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); ctx.restore();

        // 🛰️ РИСУЕМ СПУТНИК НА ОРБИТЕ ПЛАНЕТЫ
        let satX = x + Math.cos(satelliteAngle) * (r * 1.4); let satY = y + Math.sin(satelliteAngle) * (r * 0.6);
        ctx.save(); ctx.fillStyle = "#cbd5e1"; ctx.shadowBlur = 10; ctx.shadowColor = "#ffffff";
        ctx.beginPath(); ctx.領 = ctx.arc(satX, satY, 5, 0, Math.PI*2); ctx.fill(); // Корпус
        ctx.fillStyle = "#38bdf8"; ctx.fillRect(satX - 15, satY - 2, 8, 4); ctx.fillRect(satX + 7, satY - 2, 8, 4); // Батареи
        ctx.restore();
    }

    function draw() {
        let b = biomes[currentBiomeIdx];
        ctx.fillStyle = '#020308'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = "#ffffff";
        for(let i=0; i<stars.length; i++) {
            let s = stars[i]; s.alpha += (Math.random() - 0.5) * 0.02; s.alpha = Math.max(0.2, Math.min(1, s.alpha));
            ctx.globalAlpha = s.alpha; ctx.fillRect(s.x % canvas.width, s.y % canvas.height, s.size, s.size);
        }
        ctx.globalAlpha = 1;

        // ☄️ ЛОГИКА МЕТЕОРИТОВ
        if(!meteor.active && Math.random() < 0.005) {
            meteor.x = Math.random() * canvas.width; meteor.y = -50;
            meteor.vx = (Math.random() - 0.3) * 10 + 5; meteor.vy = Math.random() * 8 + 6; meteor.active = true;
        }
        if(meteor.active) {
            meteor.x += meteor.vx; meteor.y += meteor.vy;
            let mGrad = ctx.createLinearGradient(meteor.x, meteor.meteorY, meteor.x - meteor.vx*4, meteor.y - meteor.vy*4);
            mGrad.addColorStop(0, '#ffffff'); mGrad.addColorStop(0.2, b.neon); mGrad.addColorStop(1, 'transparent');
            ctx.strokeStyle = mGrad; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(meteor.x, meteor.y); ctx.lineTo(meteor.x - meteor.vx*4, meteor.y - meteor.vy*4); ctx.stroke();
            if(meteor.y > canvas.height + 50 || meteor.x > canvas.width + 50) meteor.active = false;
        }

        let planetSize = Math.min(canvas.width, canvas.height) * 0.22; drawPlanet(canvas.width * 0.25, canvas.height * 0.35, planetSize);

        // Газовые частицы
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.alpha -= 0.02;
            if(p.alpha <= 0) { particles.splice(i, 1); continue; }
            ctx.save(); ctx.globalAlpha = p.alpha; ctx.shadowBlur = 8; ctx.shadowColor = p.color; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); ctx.restore();
        }

        // 💥 ВЫЛЕТАЮЩИЕ ЦИФРЫ ТЕКСТА КЛИКА
        for(let i = texts.length - 1; i >= 0; i--) {
            let t = texts[i]; t.y += t.vy; t.alpha -= 0.02;
            if(t.alpha <= 0) { texts.splice(i, 1); continue; }
            ctx.save(); ctx.globalAlpha = t.alpha; ctx.font = "black 18px sans-serif"; ctx.fillStyle = t.color; ctx.shadowBlur = 5; ctx.shadowColor = t.color;
            ctx.fillText(t.text, t.x - 15, t.y); ctx.restore();
        }

        ballRadius += (targetRadius - ballRadius) * 0.15;
        let cx = canvas.width / 2; let cy = canvas.height / 2;
        ctx.save(); ctx.shadowBlur = 40; ctx.shadowColor = b.neon;
        let grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, ballRadius); grad.addColorStop(0, b.neon); grad.addColorStop(1, b.secondary);
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, ballRadius, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 4; ctx.stroke(); ctx.restore();
        requestAnimationFrame(draw);
    }

    window.addEventListener('pointerdown', (e) => {
        if(e.target.tagName === 'BUTTON' || e.target.closest('.board') || e.target.closest('.shop')) return;
        let cx = canvas.width / 2; let cy = canvas.height / 2;
        if(Math.hypot(e.clientX - cx, e.clientY - cy) <= ballRadius + 20) { gas += clickPower; updateUI(); saveGame(); ballRadius = 55; spawnParticles(e.clientX, e.clientY); }
    });

    function updateUI(){
        selectBiome();
        mDisp.textContent=Math.floor(money).toLocaleString('ru-RU')+" руб."; gDisp.textContent="В баках: "+gas.toFixed(1)+" м³"; cPowEl.textContent=clickPower; ppsEl.textContent=pps;
        bClick.textContent=costClick+" р."; bAuto1.textContent=costAuto1+" р."; bAuto2.textContent=costAuto2+" р.";
        bClick.disabled=money<costClick; bAuto1.disabled=money<costAuto1; bAuto2.disabled=money<costAuto2; btnSell.disabled=gas <= 0;
        if(gas > 0) { btnSell.textContent = `💸 ПРОДАТЬ ЗА +${Math.floor(gas * marketPrice).toLocaleString('ru-RU')} РУБ.`; } else { btnSell.textContent = `💸 ХРАНИЛИЩЕ ПУСТО`; }
    }
    btnSell.addEventListener('click',()=>{if(gas>0){money+=gas*marketPrice; gas=0; updateUI(); saveGame();}});
    bClick.addEventListener('click',()=>{if(money>=costClick){money-=costClick; clickPower+=1; costClick=Math.round(costClick*1.5); updateUI(); saveGame();}});
    bAuto1.addEventListener('click',()=>{if(money>=costAuto1){money-=costAuto1; pps+=1; costAuto1=Math.round(costAuto1*1.6); updateUI(); saveGame();}});
    bAuto2.addEventListener('click',()=>{if(money>=costAuto2){money-=costAuto2; pps+=15; costAuto2=Math.round(costAuto2*1.6); updateUI(); saveGame();}});
    function saveGame(){localStorage.setItem('gn_money',money); localStorage.setItem('gn_gas',gas); localStorage.setItem('gn_clickPower',clickPower); localStorage.setItem('gn_pps',pps); localStorage.setItem('gn_cClick',costClick); localStorage.setItem('gn_cAuto1',costAuto1); localStorage.setItem('gn_cAuto2',costAuto2);}
    setInterval(() => { if (pps > 0) { gas += pps / 10; updateUI(); } }, 100); updateUI(); draw();
</script></body></html>
