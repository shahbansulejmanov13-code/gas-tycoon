<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Газовый Магнат</title><script src="https://yandex.ru"></script><style>
body{background:#04060f;color:#fff;font-family:sans-serif;text-align:center;padding:20px;}
.box{max-width:380px;margin:0 auto;background:#0d1632;padding:20px;border-radius:20px;border:2px solid #1e293b;}
h1{color:#00ffcc;margin:0 0 10px 0;}
.board{background:#020617;padding:15px;border-radius:12px;margin-bottom:15px;}
.btn{width:100%;padding:12px;margin:5px 0;border:none;border-radius:10px;font-weight:bold;cursor:pointer;}
.sell{background:#fbbf24;color:#000;font-size:14px;}
.balloon{width:100px;height:100px;border-radius:50%;background:#00ffcc;box-shadow:0 0 20px #00ffcc;margin:15px auto;cursor:pointer;border:none;}
.balloon:active{transform:scale(0.92);}
.shop{text-align:left;background:rgba(0,0,0,0.3);padding:10px;border-radius:12px;}
.item{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:12px;}
.buy{background:#2563eb;color:#fff;padding:5px 10px;border:none;border-radius:5px;cursor:pointer;}
</style></head><body><div class="box">
    <h1>ГАЗОВЫЙ МАГНАТ</h1>
    <div class="board">
        <div id="m-disp" style="font-size:24px;color:#fbbf24;font-weight:bold;">0 руб.</div>
        <div id="g-disp" style="margin:5px 0;color:#38bdf8;">Хранилище: 0.0 м³</div>
        <div style="font-size:11px;color:#64748b;">Клик: +<span id="c-pow">1</span> | Пассив: +<span id="pps">0</span> м³/с</div>
    </div>
    <div style="font-size:12px;margin-bottom:10px;"><span id="m-rate">Курс: 2.50 руб</span> | <span id="m-trend" style="color:#22c55e;">📈 Растет</span></div>
    <button class="btn sell" id="btn-sell" disabled>ХРАНИЛИЩЕ ПУСТО</button>
    <button class="balloon" id="balloon"></button>
    <div class="shop">
        <div class="item"><span>🔧 Вентиль (Клик +1)</span><button class="buy" id="b-click">15 р.</button></div>
        <div class="item"><span>🚜 Вышка (+1/с)</span><button class="buy" id="b-auto1">100 р.</button></div>
        <div class="item"><span>🏢 Газопровод (+15/с)</span><button class="buy" id="b-auto2">850 р.</button></div>
    </div>
    <button style="background:none;border:none;color:#ef4444;font-size:10px;margin-top:15px;cursor:pointer;" id="reset">Сбросить игру</button>
</div><script {nonce}>
    let ysdkInstance = null; if (typeof YaGames!=='undefined'){YaGames.init().then(ysdk=>{ysdkInstance=ysdk;ysdk.adv.showFullscreenAdv({callbacks:{}});});}
    let money=Number(localStorage.getItem('g_money'))||0, gas=Number(localStorage.getItem('g_gas'))||0, clickPower=Number(localStorage.getItem('g_clickPower'))||1, pps=Number(localStorage.getItem('g_pps'))||0;
    let costClick=Number(localStorage.getItem('g_cClick'))||15, costAuto1=Number(localStorage.getItem('g_cAuto1'))||100, costAuto2=Number(localStorage.getItem('g_cAuto2'))||850, marketPrice = 2.50;
    const mDisp=document.getElementById('m-disp'), gDisp=document.getElementById('g-disp'), cPowEl=document.getElementById('c-pow'), ppsEl=document.getElementById('pps'), mRateEl=document.getElementById('m-rate'), mTrendEl=document.getElementById('m-trend'), btnSell=document.getElementById('btn-sell'), balloon=document.getElementById('balloon'), bClick=document.getElementById('b-click'), bAuto1=document.getElementById('b-auto1'), bAuto2=document.getElementById('b-auto2');
    function updateUI(){
        mDisp.textContent=Math.floor(money).toLocaleString('ru-RU')+" руб."; gDisp.textContent="Хранилище: "+gas.toFixed(1)+" м³"; cPowEl.textContent=clickPower; ppsEl.textContent=pps;
        bClick.textContent=costClick+" руб."; bAuto1.textContent=costAuto1+" руб."; bAuto2.textContent=costAuto2+" руб.";
        bClick.disabled=money<costClick; bAuto1.disabled=money<costAuto1; bAuto2.disabled=money<costAuto2; btnSell.disabled=gas<=0;
        btnSell.textContent=gas>0?`💸 ПРОДАТЬ ЗА +${Math.floor(gas*marketPrice).toLocaleString('ru-RU')} РУБ.`:`💸 ХРАНИЛИЩЕ ПУСТО`;
    }
    balloon.addEventListener('click',()=>{gas+=clickPower; updateUI(); saveGame();});
    btnSell.addEventListener('click',()=>{if(gas>0){money+=gas*marketPrice; gas=0; updateUI(); saveGame();}});
    bClick.addEventListener('click',()=>{if(money>=costClick){money-=costClick; clickPower+=1; costClick=Math.round(costClick*1.5); updateUI(); saveGame();}});
    bAuto1.addEventListener('click',()=>{if(money>=costAuto1){money-=costAuto1; pps+=1; costAuto1=Math.round(costAuto1 * 1.6); updateUI(); saveGame();}});
    bAuto2.addEventListener('click',()=>{if(money>=costAuto2){money-=costAuto2; pps+=15; costAuto2=Math.round(costAuto2 * 1.6); updateUI(); saveGame();}});
    setInterval(()=>{
        let old=marketPrice; marketPrice+=(Math.random()*1.6)-0.8; marketPrice=Math.min(8.50,Math.max(1.50,marketPrice)); mRateEl.textContent=`Курс: ${marketPrice.toFixed(2)} руб`;
        if(marketPrice>=old){mTrendEl.textContent="📈 Растет"; mTrendEl.className="trend-up";}else{mTrendEl.textContent="📉 Падает"; mTrendEl.className="trend-down";} updateUI();
    },12000);
    function saveGame(){localStorage.setItem('g_money',money); localStorage.setItem('g_gas',gas); localStorage.setItem('g_clickPower',clickPower); localStorage.setItem('g_pps',pps); localStorage.setItem('g_cClick',costClick); localStorage.setItem('g_cAuto1',costAuto1); localStorage.setItem('g_cAuto2',costAuto2);}
    setInterval(()=>{if(pps > 0){gas+=pps/10; updateUI();}},100);
    document.getElementById('reset').addEventListener('click',()=>{if(confirm("Сбросить?")){localStorage.clear(); location.reload();}}); updateUI();
</script></body></html>
