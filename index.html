<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Газовый Магнат</title>
    <style>
        body {
            background-color: #1e1e24;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            text-align: center;
            padding-top: 50px;
            user-select: none;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #2a2a35;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        h1 { color: #00d2ff; margin-bottom: 5px; }
        .stat { font-size: 24px; margin: 15px 0; font-weight: bold; }
        .sub-stat { font-size: 16px; color: #a0a0b0; margin-bottom: 25px; }
        
        /* Главная кнопка-вентиль */
        #clickBtn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 5px solid #00d2ff;
            background: radial-gradient(circle, #005f73 0%, #002233 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.4);
            transition: transform 0.05s, box-shadow 0.2s;
            outline: none;
        }
        #clickBtn:active { transform: scale(0.95); }
        #clickBtn:hover { box-shadow: 0 0 30px rgba(0, 210, 255, 0.8); }

        /* Секция магазина */
        .shop-box { margin-top: 40px; text-align: left; }
        .upgrade-btn {
            width: 100%;
            background-color: #3a3a4c;
            color: white;
            border: 1px solid #555;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            transition: background 0.2s;
        }
        .upgrade-btn:hover { background-color: #4a4a60; }
        .upgrade-btn:disabled { background-color: #222; color: #666; cursor: not-allowed; border-color: #333; }
    </style>
</head>
<body>

<div class="container">
    <h1>ГАЗОВЫЙ МАГНАТ</h1>
    <div class="stat">Баланс: <span id="money">0</span> ₽</div>
    <div class="sub-stat">Пассивный доход: +<span id="pps">0</span> ₽/сек</div>

    <!-- Большая круглая кнопка для кликов -->
    <button id="clickBtn">ДОБЫТЬ ГАЗ</button>

    <div class="shop-box">
        <h3>Улучшения производства:</h3>
        
        <!-- Апгрейд Клика -->
        <button class="upgrade-btn" id="upgClick" onclick="buyClickUpgrade()">
            <span>🔧 Мощный ключ (+1 к клику)</span>
            <span id="costClick">Цена: 15 ₽</span>
        </button>

        <!-- Пассивный апгрейд 1 -->
        <button class="upgrade-btn" id="upgDrill" onclick="buyDrill()">
            <span>🚜 Газовая скважина (+1/сек)</span>
            <span id="costDrill">Цена: 50 ₽</span>
        </button>

        <!-- Пассивный апгрейд 2 -->
        <button class="upgrade-btn" id="upgPlant" onclick="buyPlant()">
            <span>🏭 Завод СПГ (+10/сек)</span>
            <span id="costPlant">Цена: 400 ₽</span>
        </button>
    </div>
</div>

<script>
    // 1. ИГРОВЫЕ ПЕРЕМЕННЫЕ
    let game = {
        money: 0,
        clickPower: 1,
        passiveIncome: 0,
        
        // Цены апгрейдов
        costClick: 15,
        costDrill: 50,
        costPlant: 400
    };

    // Ссылки на элементы экрана для быстрой работы
    const moneyTxt = document.getElementById("money");
    const ppsTxt = document.getElementById("pps");
    const clickBtn = document.getElementById("clickBtn");

    // 2. ЛОГИКА КЛИКА
    clickBtn.addEventListener("click", () => {
        game.money += game.clickPower;
        updateUI();
    });

    // 3. ПОКУПКА АПГРЕЙДОВ
    function buyClickUpgrade() {
        if (game.money >= game.costClick) {
            game.money -= game.costClick;
            game.clickPower += 1;
            game.costClick = Math.round(game.costClick * 1.5); // Цена растет на 50%
            updateUI();
        }
    }

    function buyDrill() {
        if (game.money >= game.costDrill) {
            game.money -= game.costDrill;
            game.passiveIncome += 1;
            game.costDrill = Math.round(game.costDrill * 1.4); // Цена растет на 40%
            updateUI();
        }
    }

    function buyPlant() {
        if (game.money >= game.costPlant) {
            game.money -= game.costPlant;
            game.passiveIncome += 10;
            game.costPlant = Math.round(game.costPlant * 1.4);
            updateUI();
        }
    }

    // 4. ТАЙМЕР ДЛЯ ПАССИВНОГО ДОХОДА (Срабатывает каждую секунду)
    setInterval(() => {
        game.money += game.passiveIncome;
        updateUI();
    }, 1000);

    // 5. ОБНОВЛЕНИЕ ИНТЕРФЕЙСА И ДОСТУПНОСТИ КНОПОК
    function updateUI() {
        moneyTxt.innerText = game.money;
        ppsTxt.innerText = game.passiveIncome;

        document.getElementById("costClick").innerText = `Цена: ${game.costClick} ₽`;
        document.getElementById("costDrill").innerText = `Цена: ${game.costDrill} ₽`;
        document.getElementById("costPlant").innerText = `Цена: ${game.costPlant} ₽`;

        // Включаем или выключаем кнопки в зависимости от баланса игрока
        document.getElementById("upgClick").disabled = (game.money < game.costClick);
        document.getElementById("upgDrill").disabled = (game.money < game.costDrill);
        document.getElementById("upgPlant").disabled = (game.money < game.costPlant);
    }

    // Запуск проверки кнопок при старте игры
    updateUI();
</script>

</body>
</html>
