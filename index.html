<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Gas Tycoon</title><script src="https://yandex.ru"></script><style>
body{margin:0;background:#02040a;color:#fff;font-family:sans-serif;overflow:hidden;user-select:none;}
#gameCanvas{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
.ui{position:relative;z-index:10;pointer-events:none;padding:15px;display:flex;flex-direction:column;align-items:center;height:100vh;box-sizing:border-box;justify-content:space-between;}
.board{background:rgba(4,7,20,0.85);padding:12px;border-radius:20px;border:1px solid #1e293b;backdrop-filter:blur(10px);pointer-events:auto;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,0.6);width:90%;max-width:380px;}
.money{font-size:26px;font-weight:900;color:#fbbf24;text-shadow:0 0 10px rgba(251,191,36,0.3);}
.btn{pointer-events:auto;width:100%;padding:12px;background:linear-gradient(135deg,var(--neon),#007799);color:#03050d;border:none;border-radius:12px;font-size:13px;font-weight:900;cursor:pointer;margin-top:8px;}
.btn:disabled{background:#1e293b;color:#475569;cursor:not-allowed;box-shadow:none;}
.shop{pointer-events:auto;background:rgba(4,7,20,0.85);padding:10px;border-radius:20px;border:1px solid #1e293b;display:flex;gap:6px;width:90%;max-width:380px;box-sizing:border-box;}
.item{background:#050a18;border:1px solid #1e293b;padding:6px;border-radius:12px;text-align:center;flex:1;display:flex;flex-direction:column;justify-content:space-between;}
.i-name{font-size:10px;font-weight:bold;color:#64748b;text-transform:uppercase;margin-bottom:4px;}
.i-btn{background:#2563eb;color:#fff;border:none;padding:6px;border-radius:6px;font-size:10px;font-weight:bold;cursor:pointer;width:100%;}
.i-btn:disabled{background:#1e293b;color:#475569;cursor:not-allowed;}
.biome-badge{font-size:11px;font-weight:bold;color:var(--neon);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;text-shadow:0 0 10px var(--neon);}
</style></head><body><canvas id="gameCanvas"></canvas><div class="ui">
    <div class="board">
        <div class="biome-badge" id="biome-disp">Локация: Сибирь</div>
        <div class="money" id="m-disp">0 руб.</div>
        <div style="font-size:15px;color:#38bdf8;font-weight:bold;margin:2px 0;" id="g-disp">В баках: 0.0 м³</div>
        <div style="font-size:10px;color:#64748b;font-weight:bold;margin-bottom:4px;">КЛИК: +<span id="c-pow">1</span> | ПАССИВ: +<span id="pps">0</span> м³/с</div>
        <button class="btn" id="btn-sell" disabled>💸 ХРАНИЛИЩЕ ПУСТО</button>
    </div>
    <div class="shop">
        <div class="item"><div class="i-name">🔧 Клик</div><button class="i-btn" id="b-click">15 р.</button></div>
        <div class="item"><div class="i-name">🚜 Вышка</div><button class="i-btn" id="b-auto1">100 р.</button></div>
        <div class="item"><div class="i-name">🏢 Завод</div><button class="i-btn" id="b-auto2">850 р.</button></div>
    </div>
</div><script {nonce}>
    let ysdkInstance = null; if (typeof YaGames!=='undefined'){YaGames.init().then(ysdk=>{ysdkInstance=ysdk;ysdk.adv.showFullscreenAdv({callbacks:{}});});}
    let money=Number(localStorage.getItem('gn_money'))||0, gas=Number(localStorage.getItem('gn_gas'))||0, clickPower=Number(localStorage.getItem('gn_clickPower'))||1, pps=Number(localStorage.getItem('gn_pps'))||0;
    let costClick=Number(localStorage.getItem('gn_cClick'))||15, costAuto1=Number(localStorage.getItem('gn_cAuto1'))||100, costAuto2=Number(localStorage.getItem('gn_cAuto2'))||850, marketPrice = 3.5;
    const mDisp=document.getElementById('m-disp'),gDisp=document.getElementById('g-disp'),cPowEl=document.getElementById('c-pow'),ppsEl=document.getElementById('pps'),btnSell=document.getElementById('btn-sell'),bClick=document.getElementById('b-click'),bAuto1=document.getElementById('b-auto1'),bAuto2=document.getElementById('b-auto2'),biomeDisp=document.getElementById('biome-disp');
    const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } window.addEventListener('resize', resize); resize();
    let ballRadius = 80; let targetRadius = 80; const particles = [];
    const biomes = [
        { name: "Локация: Сибирь ❄️", neon: "#00ffcc", secondary: "#006655", bg1: "#02040a", bg2: "#051329" },
        { name: "Локация: Шельф пустыни 🏜️", neon: "#ff7700", secondary: "#772200", bg1: "#050302", bg2: "#240d04" },
        { name: "Локация: Кибер-Завод 🏭", neon: "#39ff14", secondary: "#146603", bg1: "#020503", bg2: "#092405" },
        { name: "Локация: Станция Марс 🪐", neon: "#e0115f", secondary: "#660527", bg1: "#050108", bg2: "#22043a" }
    ];
    let currentBiomeIdx = 0;
    function selectBiome() {
        if (money < 500) currentBiomeIdx = 0;
        else if (money < 2500) currentBiomeIdx = 1;
        else if (money < 15000) currentBiomeIdx = 2;
        else currentBiomeIdx = 3;
        let b = biomes[currentBiomeIdx]; document.documentElement.style.setProperty('--neon', b.neon); biomeDisp.textContent = b.name;
    }
    function spawnParticles(clickX, clickY) {
        let b = biomes[currentBiomeIdx];
        for(let i=0; i<20; i++) {
            particles.push({
                x: clickX, y: clickY, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6 - 2,
                size: Math.random() * 3 + 2, alpha: 1, color: Math.random() > 0.4 ? b.neon : '#ffffff'
            });
        }
    }
    function draw() {
        let b = biomes[currentBiomeIdx];
        let bgGrad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 10, canvas.width/2, canvas.height/2, canvas.width);
        bgGrad.addColorStop(0, b.bg2); bgGrad.addColorStop(1, b.bg1); ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, canvas.width, canvas.height);
        for(let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.alpha -= 0.02;
            if(p.alpha <= 0) { particles.splice(i, 1); continue; }
            ctx.save(); ctx.globalAlpha = p.alpha; ctx.shadowBlur = 8; ctx.shadowColor = p.color; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); ctx.restore();
        }
        ballRadius += (targetRadius - ballRadius) * 0.15; let cx = canvas.width / 2; let cy = canvas.height / 2;
        ctx.save(); ctx.shadowBlur = 40; ctx.shadowColor = b.neon;
        let grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, ballRadius); grad.addColorStop(0, b.neon); grad.addColorStop(1, b.secondary);
        ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(cx, cy, ballRadius, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 4; ctx.stroke(); ctx.restore();
        requestAnimationFrame(draw);
    }
    window.addEventListener('pointerdown', (e) => {
        if(e.target.tagName === 'BUTTON' || e.target.closest('.board') || e.target.closest('.shop')) return;
        let cx = canvas.width / 2; let cy = canvas.height / 2;
        if(Math.hypot(e.clientX - cx, e.clientY - cy) <= ballRadius + 20) { gas += clickPower; updateUI(); saveGame(); ballRadius = 60; spawnParticles(e.clientX, e.clientY); }
    });
    function updateUI(){
        selectBiome();
        mDisp.textContent=Math.floor(money).toLocaleString('ru-RU')+" руб."; gDisp.textContent="В баках: "+gas.toFixed(1)+" м³"; cPowEl.textContent=clickPower; ppsEl.textContent=pps;
        bClick.textContent=costClick+" р."; bAuto1.textContent=costAuto1+" р."; bAuto2.textContent=costAuto2+" р.";
        bClick.disabled=money<costClick; bAuto1.disabled=money<costAuto1; bAuto2.disabled=money<costAuto2; btnSell.disabled=gas <= 0;
        if(gas > 0) { btnSell.textContent = `💸 ПРОДАТЬ ЗА +${Math.floor(gas * marketPrice).toLocaleString('ru-RU')} РУБ.`; } else { btnSell.textContent = `💸 ХРАНИЛИЩЕ ПУСТО`; }
    }
    btnSell.addEventListener('click',()=>{if(gas>0){money+=gas*marketPrice; gas=0; updateUI(); saveGame();}});
    bClick.addEventListener('click',()=>{if(money>=costClick){money-=costClick; clickPower+=1; costClick=Math.round(costClick*1.5); updateUI(); saveGame();}});
    bAuto1.addEventListener('click',()=>{if(money>=costAuto1){money-=costAuto1; pps+=1; costAuto1=Math.round(costAuto1*1.6); updateUI(); saveGame();}});
    bAuto2.addEventListener('click',()=>{if(money>=costAuto2){money-=costAuto2; pps+=15; costAuto2=Math.round(costAuto2*1.6); updateUI(); saveGame();}});
    function saveGame(){localStorage.setItem('gn_money',money); localStorage.setItem('gn_gas',gas); localStorage.setItem('gn_clickPower',clickPower); localStorage.setItem('gn_pps',pps); localStorage.setItem('gn_cClick',costClick); localStorage.setItem('gn_cAuto1',costAuto1); localStorage.setItem('gn_cAuto2',costAuto2);}
    setInterval(() => { if (pps > 0) { gas += pps / 10; updateUI(); } }, 100); updateUI(); draw();
</script></body></html>
