<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Газовая Империя: Экономическая Стратегия</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #060814, #0b112c);
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }
        h1 { margin-bottom: 2px; color: #00ffcc; text-shadow: 0 0 15px rgba(0,255,204,0.4); font-size: 28px; }
        .rank-badge { background: #1e293b; color: #38bdf8; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold; margin-bottom: 15px; border: 1px solid #334155; }
        .stats { margin: 10px 0; font-size: 14px; color: #9ca3af; }
        
        .score-container {
            font-size: 32px;
            margin-bottom: 20px;
            background: rgba(0, 255, 204, 0.03);
            padding: 12px 35px;
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 204, 0.25);
            font-weight: 900;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            letter-spacing: 1px;
        }

        .event-box {
            width: 330px;
            height: 45px;
            margin-bottom: 15px;
            padding: 8px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            border: 1px dashed #374151;
            transition: all 0.3s ease;
        }
        .event-active { background: rgba(234, 179, 8, 0.15); border: 1px solid #eab308; color: #fde047; text-shadow: 0 0 8px rgba(234,179,8,0.3); }
        .event-bad { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }

        .click-area { position: relative; width: 180px; height: 180px; margin-bottom: 20px; }
        #click-btn {
            width: 100%; height: 100%; border-radius: 50%; border: 4px solid #00ffcc;
            background: #111c3a; cursor: pointer; box-shadow: 0 0 35px rgba(0, 255, 204, 0.2);
            transition: transform 0.05s, box-shadow 0.1s; display: flex; align-items: center; justify-content: center;
        }
        #click-btn:active { transform: scale(0.94); box-shadow: 0 0 20px rgba(0, 255, 204, 0.5); }
        
        .flame-icon {
            width: 85px; height: 85px; background: #00ffcc;
            clip-path: polygon(50% 0%, 80% 20%, 95% 50%, 85% 85%, 50% 100%, 15% 85%, 5% 50%, 20% 20%);
            animation: pulse 1s infinite alternate; filter: drop-shadow(0 0 15px #00ffcc);
        }
        @keyframes pulse { 0% { transform: scale(0.93); opacity: 0.8; } 100% { transform: scale(1.03); opacity: 1; } }

        .floating-text { position: absolute; color: #00ffcc; font-size: 24px; font-weight: bold; pointer-events: none; animation: floatUp 0.5s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, -50%) translateY(0); } 100% { opacity: 0; transform: translate(-50%, -50%) translateY(-80px); } }

        .shop { background: rgba(15, 23, 42, 0.6); padding: 18px; border-radius: 16px; width: 340px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .shop h3 { margin-top: 0; color: #00ffcc; font-size: 16px; margin-bottom: 12px; }
        .shop-btn {
            width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 8px;
            background: linear-gradient(to right, #1e40af, #3b82f6); color: white; font-size: 13px;
            font-weight: bold; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between;
        }
        .shop-btn:hover { filter: brightness(1.15); }
        .shop-btn:disabled { background: #1e293b; color: #64748b; cursor: not-allowed; filter: none; }
        .reset-btn { margin-top: 25px; background: none; border: 1px solid #ef4444; color: #ef4444; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>

    <h1>Газовая Империя</h1>
    <div class="rank-badge" id="rank-val">Статус: Рабочий скважины</div>
    
    <div class="score-container">💨 <span id="balance">0</span> м³</div>
    <div class="stats">Пассивный доход: <span id="cps-val">0</span> м³/с | За клик: +<span id="click-val">1</span> м³</div>

    <div class="event-box" id="event-box">На рынке всё спокойно...</div>

    <div class="click-area" id="click-area">
        <button id="click-btn"><div class="flame-icon"></div></button>
    </div>

    <div class="shop">
        <h3>Управление активами</h3>
        <button id="up-click-btn" class="shop-btn"><span>🔧 Модернизация вентиля (+1)</span><span id="cost-click">10</span></button>
        <button id="up-auto1-btn" class="shop-btn"><span>🚜 Буровая установка (+1/с)</span><span id="cost-auto1">60</span></button>
        <button id="up-auto2-btn" class="shop-btn"><span>🏢 Магистральный провод (+12/с)</span><span id="cost-auto2">600</span></button>
        <button id="up-auto3-btn" class="shop-btn"><span>🌐 Экспортный контракт (+150/с)</span><span id="cost-auto3">6500</span></button>
    </div>

    <button class="reset-btn" id="reset-btn">Сбросить активы</button>
    <script {nonce}>
        let balance = Number(localStorage.getItem('ge_balance')) || 0;
        let clickPower = Number(localStorage.getItem('ge_clickPower')) || 1;
        let cps = Number(localStorage.getItem('ge_cps')) || 0;

        let costClick = Number(localStorage.getItem('ge_costClick')) || 10;
        let costAuto1 = Number(localStorage.getItem('ge_costAuto1')) || 60;
        let costAuto2 = Number(localStorage.getItem('ge_costAuto2')) || 600;
        let costAuto3 = Number(localStorage.getItem('ge_costAuto3')) || 6500;

        let eventMultiplier = 1;

        const balanceEl = document.getElementById('balance');
        const cpsEl = document.getElementById('cps-val');
        const clickEl = document.getElementById('click-val');
        const rankEl = document.getElementById('rank-val');
        const eventBox = document.getElementById('event-box');
        
        const clickBtn = document.getElementById('click-btn');
        const clickArea = document.getElementById('click-area');
        
        const upClickBtn = document.getElementById('up-click-btn');
        const upAuto1Btn = document.getElementById('up-auto1-btn');
        const upAuto2Btn = document.getElementById('up-auto2-btn');
        const upAuto3Btn = document.getElementById('up-auto3-btn');
        
        const costClickEl = document.getElementById('cost-click');
        const costAuto1El = document.getElementById('cost-auto1');
        const costAuto2El = document.getElementById('cost-auto2');
        const costAuto3El = document.getElementById('cost-auto3');

        function updateUI() {
            balanceEl.textContent = Math.floor(balance).toLocaleString('ru-RU');
            cpsEl.textContent = (cps * eventMultiplier).toFixed(1);
            clickEl.textContent = clickPower * eventMultiplier;

            costClickEl.textContent = costClick;
            costAuto1El.textContent = costAuto1;
            costAuto2El.textContent = costAuto2;
            costAuto3El.textContent = costAuto3;
            
            upClickBtn.disabled = balance < costClick;
            upAuto1Btn.disabled = balance < costAuto1;
            upAuto2Btn.disabled = balance < costAuto2;
            upAuto3Btn.disabled = balance < costAuto3;

            updateRank();
        }

        function updateRank() {
            if (balance < 1000) rankEl.textContent = "Статус: Рабочий скважины";
            else if (balance < 25000) rankEl.textContent = "Статус: Мастер участка 🛠️";
            else if (balance < 500000) rankEl.textContent = "Статус: Директор филиала 🏢";
            else rankEl.textContent = "Статус: Газовый Магнат 👑";
        }

        clickBtn.addEventListener('click', () => {
            let gained = clickPower * eventMultiplier;
            balance += gained;
            updateUI();
            createFloatingText(gained);
        });

        function createFloatingText(amount) {
            const text = document.createElement('div');
            text.className = 'floating-text';
            text.textContent = `+${amount}`;
            text.style.left = `50%`;
            text.style.top = `50%`;
            clickArea.appendChild(text);
            setTimeout(() => { text.remove(); }, 500);
        }

        upClickBtn.addEventListener('click', () => { if (balance >= costClick) { balance -= costClick; clickPower += 1; costClick = Math.round(costClick * 1.5); updateUI(); saveGame(); } });
        upAuto1Btn.addEventListener('click', () => { if (balance >= costAuto1) { balance -= costAuto1; cps += 1; costAuto1 = Math.round(costAuto1 * 1.6); updateUI(); saveGame(); } });
        upAuto2Btn.addEventListener('click', () => { if (balance >= costAuto2) { balance -= costAuto2; cps += 12; costAuto2 = Math.round(costAuto2 * 1.6); updateUI(); saveGame(); } });
        upAuto3Btn.addEventListener('click', () => { if (balance >= costAuto3) { balance -= costAuto3; cps += 150; costAuto3 = Math.round(costAuto3 * 1.7); updateUI(); saveGame(); } });

        setInterval(() => {
            let rand = Math.random();
            eventBox.className = "event-box";
            if (rand < 0.15) {
                eventMultiplier = 2;
                eventBox.textContent = "🚀 Бум спроса! Доход и клики УДВОЕНЫ на 12 сек!";
                eventBox.classList.add("event-active");
                setTimeout(() => { eventMultiplier = 1; eventBox.textContent = "На рынке всё спокойно..."; eventBox.className = "event-box"; updateUI(); }, 12000);
            } else if (rand > 0.88 && balance > 500) {
                let loss = Math.round(balance * 0.1);
                balance -= loss;
                eventBox.textContent = `⚠️ Утечка на линии! Потеряно ${loss} м³ газа`;
                eventBox.classList.add("event-bad");
                setTimeout(() => { eventBox.textContent = "На рынке всё спокойно..."; eventBox.className = "event-box"; }, 5000);
            }
            updateUI();
        }, 30000);

        function saveGame() {
            localStorage.setItem('ge_balance', balance);
            localStorage.setItem('ge_clickPower', clickPower);
            localStorage.setItem('ge_cps', cps);
            localStorage.setItem('ge_costClick', costClick);
            localStorage.setItem('ge_costAuto1', costAuto1);
            localStorage.setItem('ge_costAuto2', costAuto2);
            localStorage.setItem('ge_costAuto3', costAuto3);
        }

        setInterval(() => { if (cps > 0) { balance += (cps * eventMultiplier) / 10; updateUI(); } }, 100);
        setInterval(saveGame, 5000);

        document.getElementById('reset-btn').addEventListener('click', () => {
            if(confirm("Обнулить всю газовую империю?")) { localStorage.clear(); location.reload(); }
        });

        updateUI();
    </script>
</body>
</html>
